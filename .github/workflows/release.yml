# Pipeline: build → deploy-dev → deploy-sit → deploy-stg → deploy-prd
#
# This repo only builds the image. Deploy calls the platform-hosted action
# (mitdo-garden/mdg-infra-platform/.github/actions/ship-env) — no
# working-directory: mdg-infra-platform in this service.
#
# Secrets/vars: AWS_ROLE_ARN, TF_STATE_BUCKET
# Optional: PLATFORM_REPO_TOKEN, PLATFORM_REPOSITORY, PLATFORM_ACTION_REF,
#           AWS_ACCOUNT_ID, AWS_REGION, TF_LOCK_TABLE
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "deploy/vault/**"
      - "deploy/aws/**"
      - "deploy/test/**"
      - ".github/workflows/vault-jwt-rotate.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      stop_after:
        description: "Run through this stage (later envs are skipped)"
        required: true
        default: deploy-prd
        type: choice
        options: [build, deploy-dev, deploy-sit, deploy-stg, deploy-prd]
      replicas:
        description: "ECS replicas for each shipped env"
        required: true
        default: "1"
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  PLATFORM_REPOSITORY: ${{ vars.PLATFORM_REPOSITORY || 'mitdo-garden/mdg-infra-platform' }}
  SERVICE_NAME: auth
  ECR_REPOSITORY: mdg-auth-svc
  STOP_AFTER: ${{ github.event_name != 'workflow_dispatch' && 'deploy-prd' || inputs.stop_after }}
  REPLICAS: ${{ github.event.inputs.replicas || '1' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout service (docker context only)
        uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: image
        run: |
          set -euo pipefail
          account="${{ vars.AWS_ACCOUNT_ID }}"
          [[ -n "$account" ]] || account="$(aws sts get-caller-identity --query Account --output text)"
          tag="sha-${GITHUB_SHA::12}"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "uri=${registry}/${ECR_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR exists (bootstrap via platform action if missing)
        if: ${{ true }}
        id: ecr
        run: |
          set -euo pipefail
          if aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # First-time ECR: ship empty shell through platform action (dev).
      - name: Bootstrap auth shell for ECR
        if: steps.ecr.outputs.exists == 'false'
        uses: mitdo-garden/mdg-infra-platform/.github/actions/ship-env@main
        with:
          env: dev
          image: ${{ steps.image.outputs.uri }}
          replicas: "0"
          ref: ${{ github.sha }}
          service_name: ${{ env.SERVICE_NAME }}
          platform_repository: ${{ env.PLATFORM_REPOSITORY }}
          platform_token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}
          service_git_token: ${{ github.token }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region: ${{ env.AWS_REGION }}
          tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          tf_lock_table: ${{ vars.TF_LOCK_TABLE || 'mdg-terraform-locks' }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          docker tag "${IMAGE}" "${REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"

  deploy-dev:
    name: deploy-dev
    needs: build
    if: ${{ contains(fromJSON('["deploy-dev","deploy-sit","deploy-stg","deploy-prd"]'), github.event_name != 'workflow_dispatch' && 'deploy-prd' || inputs.stop_after) }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: mitdo-garden/mdg-infra-platform/.github/actions/ship-env@main
        with:
          env: dev
          image: ${{ needs.build.outputs.image }}
          replicas: ${{ env.REPLICAS }}
          ref: ${{ needs.build.outputs.ref }}
          platform_repository: ${{ env.PLATFORM_REPOSITORY }}
          platform_token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}
          service_git_token: ${{ github.token }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region: ${{ env.AWS_REGION }}
          tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          tf_lock_table: ${{ vars.TF_LOCK_TABLE || 'mdg-terraform-locks' }}

  deploy-sit:
    name: deploy-sit
    needs: [build, deploy-dev]
    if: ${{ always() && needs.deploy-dev.result == 'success' && contains(fromJSON('["deploy-sit","deploy-stg","deploy-prd"]'), github.event_name != 'workflow_dispatch' && 'deploy-prd' || inputs.stop_after) }}
    runs-on: ubuntu-latest
    environment: sit
    steps:
      - uses: mitdo-garden/mdg-infra-platform/.github/actions/ship-env@main
        with:
          env: sit
          image: ${{ needs.build.outputs.image }}
          replicas: ${{ env.REPLICAS }}
          ref: ${{ needs.build.outputs.ref }}
          platform_repository: ${{ env.PLATFORM_REPOSITORY }}
          platform_token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}
          service_git_token: ${{ github.token }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region: ${{ env.AWS_REGION }}
          tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          tf_lock_table: ${{ vars.TF_LOCK_TABLE || 'mdg-terraform-locks' }}

  deploy-stg:
    name: deploy-stg
    needs: [build, deploy-sit]
    if: ${{ always() && needs.deploy-sit.result == 'success' && contains(fromJSON('["deploy-stg","deploy-prd"]'), github.event_name != 'workflow_dispatch' && 'deploy-prd' || inputs.stop_after) }}
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: mitdo-garden/mdg-infra-platform/.github/actions/ship-env@main
        with:
          env: stg
          image: ${{ needs.build.outputs.image }}
          replicas: ${{ env.REPLICAS }}
          ref: ${{ needs.build.outputs.ref }}
          platform_repository: ${{ env.PLATFORM_REPOSITORY }}
          platform_token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}
          service_git_token: ${{ github.token }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region: ${{ env.AWS_REGION }}
          tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          tf_lock_table: ${{ vars.TF_LOCK_TABLE || 'mdg-terraform-locks' }}

  deploy-prd:
    name: deploy-prd
    needs: [build, deploy-stg]
    if: ${{ always() && needs.deploy-stg.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.stop_after == 'deploy-prd') }}
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: mitdo-garden/mdg-infra-platform/.github/actions/ship-env@main
        with:
          env: prd
          image: ${{ needs.build.outputs.image }}
          replicas: ${{ env.REPLICAS }}
          ref: ${{ needs.build.outputs.ref }}
          platform_repository: ${{ env.PLATFORM_REPOSITORY }}
          platform_token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}
          service_git_token: ${{ github.token }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region: ${{ env.AWS_REGION }}
          tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          tf_lock_table: ${{ vars.TF_LOCK_TABLE || 'mdg-terraform-locks' }}
