# Test environment: MySQL + Vault Transit + mdg-auth-svc
#   make deploy-test
#   curl http://127.0.0.1:5001/healthz
name: mdg-auth-test

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mdg_auth_test
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault:
    image: hashicorp/vault:2.2
    container_name: mdg-vault-test
    ports:
      - "8201:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Transit + KV app secrets (idempotent). Auth uses VAULT_TOKEN=root in test.
  vault-init:
    image: hashicorp/vault:2.2
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      SESSION_SECRET: ${SESSION_SECRET:-test-session-secret-32bytes-minimum!!}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-test-google-client-id.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-test-google-client-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-test-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-test-github-client-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        vault secrets enable transit 2>/dev/null || true
        vault read transit/keys/jwt-access >/dev/null 2>&1 \
          || vault write -f transit/keys/jwt-access type=ecdsa-p256
        vault secrets enable -path=secret kv-v2 2>/dev/null || true
        vault kv put secret/mdg-auth/test \
          google_client_id="$GOOGLE_CLIENT_ID" \
          google_client_secret="$GOOGLE_CLIENT_SECRET" \
          github_client_id="$GITHUB_CLIENT_ID" \
          github_client_secret="$GITHUB_CLIENT_SECRET" \
          session_secret="$SESSION_SECRET"
        echo "transit + KV secret/mdg-auth/test ready"

  auth:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    ports:
      - "5001:5001"
    environment:
      APP_ENV: test
      SERVER_PORT: "5001"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: mdg_auth_test
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      VAULT_TRANSIT_KEY: jwt-access

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:5001/auth/google/callback}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:5001/auth/github/callback}

volumes:
  mysql_data:
