# Deltas on config.yaml (APP_ENV=test).
app:
  env: test

server:
  port: "${SERVER_PORT:5001}"

mysql:
  host: ${MYSQL_HOST:127.0.0.1}
  port: "${MYSQL_PORT:3306}"
  user: ${MYSQL_USER:root}
  password: "${MYSQL_PASSWORD:root}"
  database: ${MYSQL_DATABASE:mdg_auth_test}

google:
  callback_url: ${GOOGLE_CALLBACK_URL:http://localhost:5173/auth/google/callback}

github:
  callback_url: ${GITHUB_CALLBACK_URL:http://localhost:5173/auth/github/callback}

jwt:
  refresh_ttl_seconds: 3600

vault:
  address: ${VAULT_ADDR:http://127.0.0.1:8200}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}
