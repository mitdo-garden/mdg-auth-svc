# Deltas on config.yaml (APP_ENV=prd) — inject hosts/secrets via env.
app:
  env: prd

server:
  port: "${SERVER_PORT:8080}"

google:
  callback_url: ${GOOGLE_CALLBACK_URL:https://api.mitdo.cloud/auth/google/callback}

github:
  callback_url: ${GITHUB_CALLBACK_URL:https://api.mitdo.cloud/auth/github/callback}

jwt:
  access_ttl_seconds: 600

frontend:
  url: ${FRONTEND_URL:https://mitdo.cloud}

cookie:
  domain: ${COOKIE_DOMAIN:mitdo.cloud}
